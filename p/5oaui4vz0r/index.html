<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>K-9 to 5 Mobile Dog Grooming: booking app concept</title>
<style>
:root{--bg:#f6f5f2;--fg:#1d1d1b;--muted:#5c5b57;--card:#fff;--line:#e2e0da;--bar:#fff4d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--fg:#efede8;--muted:#a8a69f;--card:#1e1e1c;--line:#2e2d2a;--bar:#2b2614}}
:root[data-theme="dark"]{--bg:#141413;--fg:#efede8;--muted:#a8a69f;--card:#1e1e1c;--line:#2e2d2a;--bar:#2b2614}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.bar{background:var(--bar);border-bottom:1px solid var(--line);font-size:14px;padding:8px 16px;text-align:center}
.tools{display:flex;gap:8px;justify-content:flex-end;max-width:860px;margin:0 auto;padding:12px 16px 0}
.tools button{font:inherit;font-size:14px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:16px 16px 32px}
h1{font-size:28px;line-height:1.2;margin:0 0 8px}main>p{margin:0 0 24px;color:var(--muted)}
.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
img{display:block;width:100%;height:auto;border-radius:10px}figcaption{font-size:14px;color:var(--muted);margin-top:8px;text-align:center}
footer{max-width:860px;margin:0 auto;padding:0 16px 40px;font-size:14px;color:var(--muted)}
@media (max-width:520px){.shots{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bar" data-en="Concept by Flow Lab for K-9 to 5 Mobile Dog Grooming. Not affiliated with or endorsed by K-9 to 5 Mobile Dog Grooming. Sample data, nothing here is live." data-ru="Концепт Flow Lab для K-9 to 5 Mobile Dog Grooming. Компания с нами не связана и его не заказывала. Данные примерные, здесь ничего не работает по-настоящему."></div>
<div class="tools"><button id="lang" type="button">RU</button><button id="theme" type="button" aria-label="Theme">☾</button></div>
<main>
<h1>K-9 to 5 Mobile Dog Grooming</h1>
<p data-en="Two screens of a booking app concept: the home screen and picking a time." data-ru="Два экрана концепта приложения для записи: главный экран и выбор времени."></p>
<div class="shots">
<figure><img src="home.png" width="780" height="1688" alt="Home screen"><figcaption data-en="Home screen" data-ru="Главный экран"></figcaption></figure>
<figure><img src="booking.png" width="780" height="1688" alt="Picking a time"><figcaption data-en="Picking a time" data-ru="Выбор времени"></figcaption></figure>
</div>
</main>
<footer data-en="To remove this page, write to trading.flowlab@gmail.com." data-ru="Чтобы убрать эту страницу, напишите на trading.flowlab@gmail.com."></footer>
<script>
(function(){
var root=document.documentElement,get=function(k){try{return localStorage.getItem(k)}catch(e){return null}},set=function(k,v){try{localStorage.setItem(k,v)}catch(e){}};
var lang=get('fl-lang')||((navigator.language||'en').slice(0,2)==='ru'?'ru':'en');
function apply(){root.lang=lang;document.querySelectorAll('[data-en]').forEach(function(n){n.textContent=n.getAttribute('data-'+lang)});document.getElementById('lang').textContent=lang==='en'?'RU':'EN'}
document.getElementById('lang').onclick=function(){lang=lang==='en'?'ru':'en';set('fl-lang',lang);apply()};
var t=get('fl-theme');if(t)root.setAttribute('data-theme',t);
function dark(){var a=root.getAttribute('data-theme');return a?a==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function icon(){document.getElementById('theme').textContent=dark()?'☀':'☾'}
document.getElementById('theme').onclick=function(){var n=dark()?'light':'dark';root.setAttribute('data-theme',n);set('fl-theme',n);icon()};
apply();icon();
})();
</script>
</body>
</html>
